name: PR tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Gradle check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # TestFX's robot sends real X key events, which go to whichever window has X focus.
      # Bare Xvfb has no window manager, so focus follows the pointer and keystrokes are
      # randomly lost. A lightweight window manager gives the test stage proper focus.
      # Window decorations are turned off: when the WM reparents a window into a titled
      # frame, JavaFX learns the new screen position late, so screen-coordinate clicks can
      # land a title-bar height (about one text line) too high.
      - name: Install virtual display and window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb fluxbox

      - name: Run checks on Linux
        if: runner.os == 'Linux'
        env:
          DISPLAY: ':99'
        run: |
          mkdir -p ~/.fluxbox
          printf '[app] (name=.*)\n  [Deco] {NONE}\n[end]\n' > ~/.fluxbox/apps
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          sleep 2
          fluxbox > /dev/null 2>&1 &
          sleep 2
          ./gradlew check --info --stacktrace --no-daemon

      - name: Run checks on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat check --info --stacktrace --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ matrix.os }}
          path: richtextfx/build/reports/tests/
